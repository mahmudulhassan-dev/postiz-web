server {
    listen 80;
    listen 443 ssl http2;

    server_name amanaflow.com;

    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/amanaflow.com/;

    include /www/server/panel/vhost/nginx/extension/amanaflow.com/*.conf;

    # SSL Configuration
    ssl_certificate        /www/server/panel/vhost/cert/amanaflow.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/amanaflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # High-Performance Direct Static Asset Serving
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg|css|js|woff|woff2|ttf|eot|mp4|webm)$ {
        root /www/wwwroot/amanaflow.com;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri @ols_backend;
    }

    # Named fallback location for dynamic or rewritten assets
    location @ols_backend {
        proxy_pass https://127.0.0.1:8190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Main Dynamic Reverse Proxy to OpenLiteSpeed
    location / {
        proxy_pass https://127.0.0.1:8190;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header SERVER_PROTOCOL $server_protocol;
        proxy_set_header HTTPS $https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $connection_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header REMOTE_PORT $remote_port;

        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Block all hidden files and sensitive directories immediately at the Nginx edge
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.well-known {
        allow all;
        root /www/wwwroot/amanaflow.com/;
        try_files $uri =404;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    access_log /www/wwwlogs/amanaflow.com.log;
    error_log  /www/wwwlogs/amanaflow.com.error.log;
}
