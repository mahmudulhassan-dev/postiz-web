proxy_cache_path /www/wwwroot/post.amanaflow.com/proxy_cache_dir levels=1:2 keys_zone=post_amanaflow_com_cache:20m inactive=1d max_size=5g;

# HTTP -> HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name post.amanaflow.com;

    # Hide NGINX version for security reasons
    server_tokens off;

    # Location for Let's Encrypt validation
    include /www/server/panel/vhost/nginx/well-known/post.amanaflow.com.conf;
    location /.well-known/acme-challenge/ {
        allow all;
        root /www/wwwroot/post.amanaflow.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name post.amanaflow.com;

    # Hide NGINX version
    server_tokens off;
    autoindex off;

    root /www/wwwroot/post.amanaflow.com;
    include /www/server/panel/vhost/nginx/extension/post.amanaflow.com/*.conf;

    # SSL Certificates
    ssl_certificate /www/server/panel/vhost/cert/post.amanaflow.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/post.amanaflow.com/privkey.pem;

    # Security: SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Security Headers (Postiz recommended)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # Increase maximum post size for video & media uploads (500MB)
    client_max_body_size 500M;

    # Enable Gzip compression for better performance
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 4 32k;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/xml image/svg+xml;

    # TIKTOK OAUTH REDIRECT FIX
    location = /api/social/tiktok {
        return 302 /integrations/social/tiktok$is_args$args;
    }

    # Public Dedicated Homepage & Legal Pages
    location = / {
        root /www/wwwroot/post.amanaflow.com;
        try_files /index.html =404;
    }

    location = /home {
        root /www/wwwroot/post.amanaflow.com;
        try_files /index.html =404;
    }

    location = /terms {
        root /www/wwwroot/post.amanaflow.com;
        try_files /terms.html =404;
    }

    location = /privacy {
        root /www/wwwroot/post.amanaflow.com;
        try_files /privacy.html =404;
    }

    location = /data-deletion {
        root /www/wwwroot/post.amanaflow.com;
        try_files /data-deletion.html =404;
    }

    location ~ ^/(terms|privacy|data-deletion|index)\.html$ {
        root /www/wwwroot/post.amanaflow.com;
    }

    location /channels/ {
        root /www/wwwroot/post.amanaflow.com;
        try_files $uri $uri.html /channels/tiktok.html =404;
    }

    # Reverse Proxy to Postiz application
    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_redirect ~^http[s]?://[^/]+:(5000|4007)(/.*)$ https://post.amanaflow.com$2;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header REMOTE-HOST $remote_addr;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Prohibited access to files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        allow all;
        root /www/wwwroot/post.amanaflow.com;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Access and Error Logging
    access_log /www/wwwlogs/post.amanaflow.com.log;
    error_log /www/wwwlogs/post.amanaflow.com.error.log;
}
